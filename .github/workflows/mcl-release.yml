name: MCL release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to resume (no compilation)'
        required: true
        type: string
      target:
        description: 'Publication tasks to run using existing release assets'
        required: true
        default: all
        type: choice
        options:
          - all
          - github
          - update-server
          - website
          - cnb
          - gitlink
          - aliyunoss
          - discord
  push:
    tags:
      - 'v*'
      - '!v1.9.9'

permissions:
  contents: write

concurrency:
  group: mcl-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Release preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rustfmt
        run: rustup component add rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release guardrails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test scripts/mcl/release-policy.test.mjs
          node --test scripts/mcl/aliyunoss-release.test.mjs
          node --test scripts/mcl/set-version.test.mjs
          node --test scripts/mcl/update-manifest.test.mjs scripts/mcl/finalize-github-release.test.mjs scripts/mcl/publish-update-server.test.mjs scripts/mcl/cnb-release.test.mjs scripts/mcl/gitlink-release.test.mjs scripts/mcl/create-website-release-metadata.test.mjs
          node scripts/mcl/create-update-server-catalog.test.mjs
          node scripts/mcl/check-migrations.mjs --release
          node scripts/mcl/brand-guard.mjs
          node scripts/mcl/i18n-check.mjs
          node --test scripts/mcl/create-release-notes.test.mjs
          node --test scripts/mcl/publish-discord-release.test.mjs
          cargo fmt --all --check

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module -e 'import { releaseVersion } from "./scripts/mcl/release-utils.mjs"; releaseVersion(process.env.RELEASE_TAG)'
          release_notes="${RUNNER_TEMP}/mcl-release-notes.md"
          node scripts/mcl/create-release-notes.mjs "${RELEASE_TAG}" "$release_notes"
          if existing_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            if [[ "$existing_draft" != true ]]; then
              echo '::error::Release is already public. Use workflow_dispatch to resume publication without rebuilding.'
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$release_notes"
            exit 0
          fi

          release_args=(
            --draft
            --notes-file "$release_notes"
            --title "MCL Launcher ${RELEASE_TAG}"
          )
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${release_args[@]}"

      - name: Prepare build resources
        env:
          MCL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/mcl/sync-contributors.mjs
          node scripts/mcl/prepare-build-resources.mjs
      - name: Upload build resources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-resources
          path: target/build-resources/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: Windows x64
            runner: windows-2025
            platform: windows
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: true
      CARGO_PROFILE_RELEASE_LTO: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: release
      - name: Reserve Linux ARM64 swap for full LTO
        if: matrix.runner == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          available=$(df --output=avail -B1 "$RUNNER_TEMP" | awk 'NR == 2 { print $1 }')
          required=$((14 * 1024 * 1024 * 1024))
          if [ "$available" -lt "$required" ]; then
            echo 'Insufficient disk space for ARM64 release swap' >&2
            exit 1
          fi
          swap_file="$RUNNER_TEMP/mcl-release.swap"
          sudo fallocate -l 12G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
      - name: Set release version
        run: node scripts/mcl/set-version.mjs "${{ github.ref_name }}"
      - name: Compile application once with full LTO
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/mcl/build-desktop.mjs --profile release
      - name: Compile Windows installer UI
        if: runner.os == 'Windows'
        run: node scripts/mcl/build-desktop.mjs --profile release --installer-only
      - name: Package release assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node scripts/mcl/package-windows.mjs --profile release --output target/release-assets/upload
          else
            pnpm --filter @modrinth/app tauri bundle --ci --config tauri-release.conf.json --config tauri-updater.conf.json
            node scripts/mcl/stage-release-assets.mjs --input target/release/bundle --output target/release-assets/upload --platform linux
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: node scripts/mcl/upload-release-assets.mjs "$GITHUB_REF_NAME" target/release-assets/upload

  macos-build:
    name: Compile macOS (${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: true
      CARGO_PROFILE_RELEASE_LTO: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: release
          target: ${{ matrix.target }}
      - name: Set release version
        run: node scripts/mcl/set-version.mjs "${{ github.ref_name }}"
      - name: Compile native macOS binary with full LTO
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/mcl/build-desktop.mjs --profile release --target "${{ matrix.target }}"
      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.target }}
          overwrite: true
          path: |
            target/${{ matrix.target }}/release/MCL Launcher
            target/${{ matrix.target }}/release/mcl-build.json
          retention-days: 7
          if-no-files-found: error

  macos-universal:
    name: Package macOS universal
    needs: [preflight, macos-build]
    runs-on: macos-26
    env:
      SQLX_OFFLINE: true
      CARGO_PROFILE_RELEASE_LTO: 'true'
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: release
          package-only: 'true'
      - name: Download macOS ARM64 build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-aarch64-apple-darwin
          path: target/macos-input/aarch64-apple-darwin
      - name: Download macOS x64 build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-x86_64-apple-darwin
          path: target/macos-input/x86_64-apple-darwin
      - name: Set release version
        run: node scripts/mcl/set-version.mjs "${{ github.ref_name }}"
      - name: Merge architectures and package signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/mcl/package-macos-universal.mjs
          node scripts/mcl/stage-release-assets.mjs --input target/universal-apple-darwin/release/bundle --output target/release-assets/upload --platform macos
      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mcl/upload-release-assets.mjs "$GITHUB_REF_NAME" target/release-assets/upload

  verify-and-publish:
    name: Verify and publish existing assets
    needs: [build, macos-universal]
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && needs.build.result == 'success' && needs.macos-universal.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release-sha: ${{ steps.release-ref.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Validate requested release tag
        id: release-ref
        env:
          MANUAL_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && "$MANUAL_REF" != refs/heads/main ]]; then
            echo '::error::Resume releases from main so publication uses the current scripts.'
            exit 1
          fi
          node --input-type=module -e 'import { releaseVersion } from "./scripts/mcl/release-utils.mjs"; releaseVersion(process.env.RELEASE_TAG)'
          release_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Verify and finalize GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
        run: |
          args=()
          if [[ "$RELEASE_TARGET" != all && "$RELEASE_TARGET" != github ]]; then
            args+=(--published-only)
          fi
          node scripts/mcl/finalize-github-release.mjs "$RELEASE_TAG" release-check "${args[@]}"

      - name: Build Update Server artifact catalog
        run: |
          node scripts/mcl/create-update-server-catalog.mjs \
            release-check/release.json \
            "${RELEASE_TAG}" \
            release-check/update-server-catalog.json
          node scripts/mcl/create-update-server-catalog.test.mjs

      - name: Upload published release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-release-metadata
          path: release-check/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  notify-discord:
    name: Notify Discord
    needs: [verify-and-publish, notify-update-server]
    if: ${{ !cancelled() && needs.verify-and-publish.result == 'success' && (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'discord') }}
    permissions:
      contents: read
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

  notify-update-server:
    name: Notify Update Server
    needs: verify-and-publish
    timeout-minutes: 45
    if: ${{ !cancelled() && needs.verify-and-publish.result == 'success' && (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'update-server') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Download published release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release-metadata
          path: release-check
      - name: Notify Update Server to publish release assets
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          UPDATE_SERVER_WEBHOOK_SECRET: ${{ secrets.UPDATE_SERVER_WEBHOOK_SECRET }}
          UPDATE_SERVER_FORCE_UPDATE: 'false'
        run: |
          node scripts/mcl/publish-update-server.mjs \
            release-check/update-server-catalog.json \
            release-check/release.json \
            "${RELEASE_TAG}"

  publish-website:
    name: Build and deploy website to Cloudflare Pages
    needs: verify-and-publish
    if: ${{ !cancelled() && needs.verify-and-publish.result == 'success' && (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'website') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: website-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Check Cloudflare Pages deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]]; then
            echo '::error::Configure the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the CLOUDFLARE_PAGES_PROJECT_NAME variable. See apps/website/README.md.'
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Download published release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release-metadata
          path: release-check
      - name: Checkout website publication branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: website-publish
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Generate website release data from the release tag
        run: |
          if [[ "${RELEASE_TAG}" != *-* ]]; then
            node scripts/mcl/create-website-release-metadata.mjs \
              release-check/release.json \
              website-publish/apps/website/releases/latest.json
          fi

          node scripts/mcl/create-website-release-catalog.mjs \
            website-publish/apps/website/releases/catalog.json \

      - name: Install website dependencies
        working-directory: website-publish
        run: pnpm install --frozen-lockfile --filter @mcl/website...
      - name: Build website
        working-directory: website-publish
        run: pnpm --filter @mcl/website build
      - name: Verify prerendered release notes
        working-directory: website-publish
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const version = process.env.RELEASE_TAG.replace(/^v/, '')
          const catalog = JSON.parse(fs.readFileSync('apps/website/releases/catalog.json', 'utf8'))
          const html = fs.readFileSync('apps/website/.output/public/changelog/index.html', 'utf8')
          assert(html.includes(version), `Release ${version} was not prerendered`)
          assert(fs.existsSync('apps/website/.output/public/index.html'), 'Missing website homepage')
          NODE
      - name: Save static website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-static-${{ env.RELEASE_TAG }}
          path: website-publish/apps/website/.output/public/
          retention-days: 7
          if-no-files-found: error
      - name: Sync generated release data to main
        run: |
          git -C website-publish config user.name "MCL Release Bot"
          git -C website-publish config user.email "release@mcl.local"
          git -C website-publish add apps/website/releases/latest.json apps/website/releases/catalog.json
          if git -C website-publish diff --cached --quiet; then
            echo "Website release data is unchanged"
          else
            git -C website-publish commit -m "chore(website): update release data for ${RELEASE_TAG} [skip ci]"
            git -C website-publish push origin main
          fi
      - name: Deploy prebuilt website to Cloudflare Pages
        working-directory: website-publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --package=wrangler@4.152.0 dlx wrangler pages deploy \
            apps/website/.output/public \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main \
            --commit-message "Launcher ${RELEASE_TAG} (GitHub Actions ${GITHUB_RUN_ID})"

  mirror-cnb:
    name: Mirror release to CNB
    needs: verify-and-publish
    if: ${{ !cancelled() && needs.verify-and-publish.result == 'success' && (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'cnb') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Download published release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release-metadata
          path: release-check
      - name: Mirror published release to CNB
        env:
          CNB_REPO_URL_HTTPS: ${{ secrets.CNB_REPO_URL_HTTPS }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_TOKEN_USER_NAME: ${{ secrets.CNB_TOKEN_USER_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.verify-and-publish.outputs.release-sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CNB_TOKEN:-}" ]]; then
            echo "CNB_TOKEN is not configured"
            exit 1
          fi

          cnb_url="${CNB_REPO_URL_HTTPS:-https://cnb.cool/mcl/MCL.git}"
          token_user="${CNB_TOKEN_USER_NAME:-cnb}"
          auth="$(printf '%s:%s' "$token_user" "$CNB_TOKEN" | base64 -w0)"
          git_cnb() {
            git -c "http.extraHeader=Authorization: Basic $auth" "$@"
          }

          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          git_cnb push --force "$cnb_url" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          node scripts/mcl/cnb-release.mjs finalize "${RELEASE_TAG}" cnb-release/final
          node scripts/mcl/verify-update-manifest.mjs \
            cnb-release/final/latest.json "${RELEASE_TAG}" cnb

  mirror-aliyunoss:
    name: Mirror release to Aliyun OSS
    needs: verify-and-publish
    if: ${{ !cancelled() && needs.verify-and-publish.result == 'success' && (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'aliyunoss') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: aliyunoss-release-mirror
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install OSS SDK
        run: npm install --prefix "$RUNNER_TEMP/aliyunoss-sdk" --ignore-scripts --no-audit --no-fund ali-oss@6.23.0
      - name: Download published release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release-metadata
          path: release-check
      - name: Upload all release assets and prune expired versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALIYUN_OSS_SDK_DIR: ${{ runner.temp }}/aliyunoss-sdk
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_STS_TOKEN: ${{ secrets.ALIYUN_OSS_STS_TOKEN }}
          RELEASE_RETENTION_COUNT: ${{ vars.RELEASE_RETENTION_COUNT || '3' }}
          BETA_RETENTION_COUNT: ${{ vars.BETA_RETENTION_COUNT || '3' }}
        run: node scripts/mcl/aliyunoss-release.mjs release-check/release.json "${RELEASE_TAG}"

  mirror-gitlink:
    name: Mirror release to GitLink
    needs: verify-and-publish
    if: ${{ !cancelled() && needs.verify-and-publish.result == 'success' && (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'gitlink') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Download published release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release-metadata
          path: release-check
      - name: Mirror published release to GitLink
        env:
          GITLINK_TOKEN: ${{ secrets.GITLINK_TOKEN }}
          GITLINK_REPO_SLUG: ${{ vars.GITLINK_REPO_SLUG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GITLINK_TOKEN:-}" ]]; then
            echo "GITLINK_TOKEN is not configured"
            exit 1
          fi

          node scripts/mcl/gitlink-release.mjs finalize "${RELEASE_TAG}" gitlink-release/final
      - name: Verify mirrored GitLink release without a token
        env:
          GITLINK_REPO_SLUG: ${{ vars.GITLINK_REPO_SLUG }}
        run: node scripts/mcl/gitlink-release.mjs verify "${RELEASE_TAG}"
