name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  # Keep local `CARGO_TARGET_DIR` overrides out of CI: every step below uses the
  # default target directory on the runner, never a developer machine path.

jobs:
  frontend:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck desktop frontend
        run: pnpm tsc:check
      - name: Lint frontend packages
        # The root `pnpm lint` script also runs the Rust linter and cargo clippy
        # for the desktop shell. Those live in the desktop CI workflow, which
        # prepares the native build resources first; keep this job fast.
        run: |
          pnpm turbo run lint --continue \
            --filter=@modrinth/app-frontend \
            --filter=@modrinth/ui \
            --filter=@modrinth/assets \
            --filter=@modrinth/utils \
            --filter=@modrinth/api-client \
            --filter=@modrinth/server \
            --filter=@modrinth/tooling-config
      - name: Check repository formatting
        run: pnpm lint:ancillary

  rust:
    name: Rust check
    runs-on: ubuntu-latest
    env:
      # The Blockbench skin editor bundle is verified by the desktop CI workflow.
      # Skipping its rebuild keeps this quick check to Rust compilation only.
      MCL_SKIP_BLOCKBENCH_BUILD: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check desktop shell compilation
        run: cargo check --package theseus_gui --features updater
